name: Upload Zalo Testing

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/zalo-testing.yml'

permissions:
  contents: read

concurrency:
  group: zalo-testing-910950117743035041
  cancel-in-progress: false

jobs:
  upload-testing:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'zalo-mini-app'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ZALO_MINI_APP_ID: '910950117743035041'
    defaults:
      run:
        working-directory: zalo-mini-app
    steps:
      - name: Verify developer authorization is configured
        working-directory: .
        env:
          ZALO_DEVELOPER_ACCESS_TOKEN: ${{ secrets.ZALO_DEVELOPER_ACCESS_TOKEN }}
        run: |
          if [ -z "$ZALO_DEVELOPER_ACCESS_TOKEN" ]; then
            echo "::error::Set ZALO_DEVELOPER_ACCESS_TOKEN under Repository secrets for this repository."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Upload the Testing version
        env:
          ZALO_DEVELOPER_ACCESS_TOKEN: ${{ secrets.ZALO_DEVELOPER_ACCESS_TOKEN }}
        run: |
          zalo_token="$(node -e 'process.stdout.write(process.env.ZALO_DEVELOPER_ACCESS_TOKEN.trim())')"
          if [ -z "$zalo_token" ]; then
            echo "::error::The Developer Access Token is empty after trimming whitespace."
            exit 1
          fi
          printf '::add-mask::%s\n' "$zalo_token"
          zalo_login_log="$(mktemp)"
          if ! npx --yes zmp-cli@4.0.7 login --app-id "$ZALO_MINI_APP_ID" --token "$zalo_token" >"$zalo_login_log" 2>&1; then
            echo "::error::Zalo CLI could not authenticate the developer for this Mini App."
            exit 1
          fi
          if grep -Eq 'Login failed|Invalid data' "$zalo_login_log"; then
            echo "::error::Zalo rejected developer authentication for the configured Mini App."
            exit 1
          fi
          unset ZALO_DEVELOPER_ACCESS_TOKEN zalo_token
          npx --yes zmp-cli@4.0.7 deploy --passive --existing --testing --outputDir www --desc "Đà Lạt Đi Đâu - bản kiểm thử"
