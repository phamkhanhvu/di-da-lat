name: Build Zalo Mini App

on:
  push:
    branches: [zalo-mini-app]
  pull_request:
    paths:
      - 'zalo-mini-app/**'
      - 'src/**'
      - '.github/workflows/zalo-mini-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zalo-mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Check the Zalo developer-token upload contract
        run: |
          cli_source_dir="$(mktemp -d)"
          npm pack --silent zmp-developer-token --pack-destination "$cli_source_dir"
          tar -xzf "$cli_source_dir"/zmp-developer-token-*.tgz -C "$cli_source_dir"
          CLI_SOURCE_DIR="$cli_source_dir/package" node --input-type=module <<'JS'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          async function list(dir) {
            const entries = await readdir(dir, { withFileTypes: true });
            return (await Promise.all(entries.map(entry => entry.isDirectory()
              ? list(join(dir, entry.name)) : join(dir, entry.name)))).flat();
          }
          const root = process.env.CLI_SOURCE_DIR;
          const info = JSON.parse(await readFile(join(root, 'package.json'), 'utf8'));
          console.log('HELPER_VERSION', info.version);
          const keys = ['NEW_ACCESS_TOKEN', 'ZMP_TOKEN', 'APP_ID=', 'zmp deploy', 'testing', 'login --'];
          const hits = new Map(keys.map(key => [key, 0]));
          for (const file of await list(root)) {
            if (!/\.(?:[cm]?js|ts|md)$/.test(file)) continue;
            const source = await readFile(file, 'utf8');
            for (const key of keys) {
              let start = 0;
              while (hits.get(key) < 6) {
                const at = source.indexOf(key, start);
                if (at < 0) break;
                console.log('HELPER_CONTRACT', key, file.slice(root.length + 1), source.slice(Math.max(at - 110, 0), at + 190).replace(/\s+/g, ' '));
                hits.set(key, hits.get(key) + 1);
                start = at + key.length;
              }
            }
          }
          JS
      - run: npm test
      - run: npm run build
      - name: Check Zalo package
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdir, readFile, stat } from 'node:fs/promises';
          import { join } from 'node:path';
          async function files(dir) {
            const entries = await readdir(dir, { withFileTypes: true });
            return (await Promise.all(entries.map(entry => entry.isDirectory()
              ? files(join(dir, entry.name)) : join(dir, entry.name)))).flat();
          }
          const config = JSON.parse(await readFile('www/app-config.json', 'utf8'));
          assert.equal(config.app.title, 'Đà Lạt Đi Đâu');
          const paths = [...config.listSyncJS, ...config.listAsyncJS, ...config.listCSS];
          assert(paths.some(path => path.endsWith('.js')));
          assert(paths.some(path => path.endsWith('.css')));
          for (const path of paths) assert((await stat(join('www', path))).isFile());
          let total = 0;
          for (const path of await files('www')) {
            const size = (await stat(path)).size;
            assert(size < 3_000_000, path);
            total += size;
          }
          assert(total < 10_000_000);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: zalo-mini-app-testing
          path: zalo-mini-app/www/
          if-no-files-found: error
