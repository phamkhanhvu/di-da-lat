name: Build Zalo Mini App

on:
  push:
    branches: [zalo-mini-app]
  pull_request:
    paths:
      - 'zalo-mini-app/**'
      - 'src/**'
      - '.github/workflows/zalo-mini-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zalo-mini-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Inspect published Zalo CLI authentication contract
        run: |
          cli_package_dir="$(mktemp -d)"
          npm pack --silent zmp-cli@4.0.7 --pack-destination "$cli_package_dir"
          tar -xzf "$cli_package_dir/zmp-cli-4.0.7.tgz" -C "$cli_package_dir"
          CLI_PACKAGE_DIR="$cli_package_dir/package" node --input-type=module <<'JS'
          import { readdir, readFile } from 'node:fs/promises';
          import { join } from 'node:path';
          async function files(dir) {
            const entries = await readdir(dir, { withFileTypes: true });
            return (await Promise.all(entries.map(entry => entry.isDirectory()
              ? files(join(dir, entry.name)) : join(dir, entry.name)))).flat();
          }
          const patterns = ['Login failed!', 'Invalid data', 'ZMP_TOKEN', 'access-token', 'app-id', 'zmp-cli-core'];
          const hits = new Map(patterns.map(pattern => [pattern, 0]));
          for (const file of await files(process.env.CLI_PACKAGE_DIR)) {
            if (!/\.(?:[cm]?js|json)$/.test(file) || file.includes('package-lock')) continue;
            const source = await readFile(file, 'utf8');
            for (const pattern of patterns) {
              let start = 0;
              while (hits.get(pattern) < 5) {
                const at = source.indexOf(pattern, start);
                if (at < 0) break;
                console.log(pattern, file.split('/package/').pop(), source.slice(Math.max(at - 150, 0), at + 240).replace(/\s+/g, ' '));
                start = at + pattern.length;
                hits.set(pattern, hits.get(pattern) + 1);
              }
            }
          }
          JS
      - run: npm test
      - run: npm run build
      - name: Check Zalo package
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdir, readFile, stat } from 'node:fs/promises';
          import { join } from 'node:path';
          async function files(dir) {
            const entries = await readdir(dir, { withFileTypes: true });
            return (await Promise.all(entries.map(entry => entry.isDirectory()
              ? files(join(dir, entry.name)) : join(dir, entry.name)))).flat();
          }
          const config = JSON.parse(await readFile('www/app-config.json', 'utf8'));
          assert.equal(config.app.title, 'Đà Lạt Đi Đâu');
          const paths = [...config.listSyncJS, ...config.listAsyncJS, ...config.listCSS];
          assert(paths.some(path => path.endsWith('.js')));
          assert(paths.some(path => path.endsWith('.css')));
          for (const path of paths) assert((await stat(join('www', path))).isFile());
          let total = 0;
          for (const path of await files('www')) {
            const size = (await stat(path)).size;
            assert(size < 3_000_000, path);
            total += size;
          }
          assert(total < 10_000_000);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: zalo-mini-app-testing
          path: zalo-mini-app/www/
          if-no-files-found: error
